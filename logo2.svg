<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      /* Background */
      .bg-box {
        opacity: 0;
        animation: fadeIn 0.4s ease 0s forwards;
      }
      @keyframes fadeIn { to { opacity: 1; } }

      /* Vertical bar - draws down with elastic ease */
      .bar-left {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: drawDown 0.65s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
      }
      @keyframes drawDown { to { stroke-dashoffset: 0; } }

      /* Top horizontal - draws right */
      .line-top {
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: drawRight 0.45s cubic-bezier(0.22,1,0.36,1) 0.7s forwards;
      }
      /* Bottom horizontal - draws right, slightly delayed */
      .line-bottom {
        stroke-dasharray: 44;
        stroke-dashoffset: 44;
        animation: drawRight 0.5s cubic-bezier(0.22,1,0.36,1) 0.75s forwards;
      }
      @keyframes drawRight { to { stroke-dashoffset: 0; } }

      /* Code stubs - slide in from left with fade */
      .stub-1, .stub-2, .stub-3, .stub-4, .stub-5, .stub-6 {
        opacity: 0;
        transform: translateX(-6px);
        animation: slideInFade 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
      }
      .stub-1 { animation-delay: 0.9s; }
      .stub-2 { animation-delay: 1.0s; }
      .stub-3 { animation-delay: 1.1s; }
      .stub-4 { animation-delay: 1.2s; }
      .stub-5 { animation-delay: 1.3s; }
      .stub-6 { animation-delay: 1.4s; }

      @keyframes slideInFade {
        to { opacity: 1; transform: translateX(0); }
      }

      /* Corner bracket draws with a path-like animation */
      .corner {
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: drawRight 0.45s cubic-bezier(0.22,1,0.36,1) 0.8s forwards;
      }

      /* Cursor: appears, then blinks, then pulses glow */
      .cursor {
        opacity: 0;
        animation:
          fadeIn 0.2s ease 1.55s forwards,
          blink 1s step-end 1.75s 4,
          pulseGlow 2.5s ease-in-out 5.75s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; filter: url(#glow); }
        50% { opacity: 0.5; filter: url(#strongglow); }
      }

      /* Bar left subtle pulse after draw */
      .bar-left {
        animation:
          drawDown 0.65s cubic-bezier(0.22,1,0.36,1) 0.15s forwards,
          barPulse 3s ease-in-out 2s infinite;
      }
      @keyframes barPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg-box" x="0" y="0" width="76" height="76" rx="3" fill="rgba(255,255,255,0.05)"/>

  <!-- Left vertical bar -->
  <line class="bar-left" x1="11.5" y1="12" x2="11.5" y2="62"
    stroke="#48CBCF" stroke-width="3" filter="url(#softglow)"/>

  <!-- Top horizontal -->
  <line class="line-top" x1="13" y1="13" x2="43" y2="13"
    stroke="#48CBCF" stroke-width="2"/>

  <!-- Bottom horizontal -->
  <line class="line-bottom" x1="13" y1="61" x2="57" y2="61"
    stroke="#444" stroke-width="2"/>

  <!-- Code stub lines -->
  <rect class="stub-1" x="20" y="21" width="36" height="2" rx="1" fill="#333"/>
  <rect class="stub-2" x="20" y="27" width="22" height="2" rx="1" fill="#333"/>
  <rect class="stub-3" x="20" y="33" width="30" height="2" rx="1" fill="#333"/>
  <rect class="stub-4" x="20" y="39" width="16" height="2" rx="1" fill="#555"/>
  <rect class="stub-5" x="20" y="45" width="28" height="2" rx="1" fill="#333"/>
  <rect class="stub-6" x="20" y="51" width="10" height="2" rx="1" fill="#555"/>

  <!-- Corner bracket -->
  <polyline class="corner" points="56,12 64,12 64,24"
    fill="none" stroke="#48CBCF" stroke-width="1.5" opacity="0.5"/>

  <!-- Cursor -->
  <rect class="cursor" x="38" y="39" width="6" height="8" rx="1"
    fill="#48CBCF" filter="url(#glow)"/>
</svg>
