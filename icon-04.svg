<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      /* ─── HUMAN FIGURE appears ─── */
      .human {
        opacity: 0;
        animation: humanIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
      }
      @keyframes humanIn {
        from { opacity:0; transform: translateY(6px); }
        to   { opacity:1; transform: translateY(0); }
      }

      /* ─── ORBIT RING draws ─── */
      .ring {
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: drawRing 0.7s cubic-bezier(0.22,1,0.36,1) 0.5s forwards;
      }
      @keyframes drawRing { to { stroke-dashoffset: 0; } }

      /* ─── INTENT LINE (human → system) ─── */
      .intent {
        stroke-dasharray: 22;
        stroke-dashoffset: 22;
        opacity: 0;
        animation: drawIntent 0.4s ease 1.1s forwards;
      }
      @keyframes drawIntent { to { stroke-dashoffset: 0; opacity:1; } }

      /* ─── AI NODE pops in ─── */
      .ai-node {
        transform-origin: center;
        transform-box: fill-box;
        opacity: 0;
        animation: nodePop 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards;
      }
      @keyframes nodePop {
        from { opacity:0; transform: scale(0); }
        to   { opacity:1; transform: scale(1); }
      }

      /* ─── AI NODE pulses ─── */
      .ai-pulse {
        opacity: 0;
        animation: nodePop 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.9s forwards,
                   aiPulse 2.6s ease-in-out 2s infinite;
      }
      @keyframes aiPulse {
        0%,100% { opacity:1; }
        50%     { opacity:0.3; }
      }

      /* ─── RESPONSE LINES (AI → output) appear staggered ─── */
      .resp {
        stroke-dashoffset: 20;
        opacity: 0;
        animation: drawResp 0.3s ease forwards;
      }
      .rp1 { stroke-dasharray: 20; animation-delay: 1.4s; }
      .rp2 { stroke-dasharray: 16; stroke-dashoffset:16; animation-delay: 1.55s; }
      .rp3 { stroke-dasharray: 18; stroke-dashoffset:18; animation-delay: 1.70s; }
      @keyframes drawResp { to { stroke-dashoffset: 0; opacity:1; } }

      /* ─── TOOL DOTS orbit the AI node ─── */
      .tool-dot {
        opacity: 0;
        animation: toolAppear 0.3s ease forwards;
      }
      .td1 { animation-delay: 1.2s; }
      .td2 { animation-delay: 1.35s; }
      .td3 { animation-delay: 1.5s; }

      @keyframes toolAppear {
        from { opacity:0; transform: scale(0); }
        to   { opacity:1; transform: scale(1); }
      }

      /* ─── TOOL DOTS spin around AI node ─── */
      .orbit1 {
        animation: toolAppear 0.3s ease 1.2s forwards,
                   orbit1spin 6s linear 2s infinite;
        transform-origin: 52px 36px;
        transform-box: view-box;
      }
      .orbit2 {
        animation: toolAppear 0.3s ease 1.35s forwards,
                   orbit2spin 8s linear 2s infinite;
        transform-origin: 52px 36px;
        transform-box: view-box;
      }
      .orbit3 {
        animation: toolAppear 0.3s ease 1.5s forwards,
                   orbit3spin 5s linear 2s infinite;
        transform-origin: 52px 36px;
        transform-box: view-box;
      }
      @keyframes orbit1spin { to { transform: rotate(360deg); } }
      @keyframes orbit2spin { to { transform: rotate(-360deg); } }
      @keyframes orbit3spin { to { transform: rotate(360deg); } }

      /* ─── THOUGHT DOTS from human to AI ─── */
      .thought {
        opacity: 0;
      }
      .th1 { animation: thoughtFlow 2.4s ease-in-out 2.2s infinite; }
      .th2 { animation: thoughtFlow 2.4s ease-in-out 2.6s infinite; }
      .th3 { animation: thoughtFlow 2.4s ease-in-out 3.0s infinite; }
      @keyframes thoughtFlow {
        0%   { opacity:0; transform: translateX(0); }
        15%  { opacity:0.8; }
        85%  { opacity:0.8; }
        100% { opacity:0; transform: translateX(18px); }
      }

      /* ─── GLOW HALO around AI ─── */
      .halo {
        opacity: 0;
        animation: haloIn 0.6s ease 1.0s forwards,
                   haloPulse 3s ease-in-out 2s infinite;
      }
      @keyframes haloIn { to { opacity:1; } }
      @keyframes haloPulse {
        0%,100% { r: 10; opacity:0.08; }
        50%     { r: 13; opacity:0.18; }
      }
    </style>
  </defs>

  <!-- ─── HUMAN FIGURE (left side) ─── -->
  <g class="human">
    <!-- head -->
    <circle cx="20" cy="24" r="5" fill="none" stroke="#48CBCF" stroke-width="1.3" opacity="0.8"/>
    <!-- body -->
    <path d="M13,44 C13,35 27,35 27,44 L27,50 L13,50 Z"
      fill="none" stroke="#48CBCF" stroke-width="1.3" opacity="0.8"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- inner fill hint -->
    <circle cx="20" cy="24" r="2.5" fill="#48CBCF" opacity="0.15"/>
    <path d="M16,44 C16,38 24,38 24,44 L24,48 L16,48 Z"
      fill="rgba(72,203,207,0.08)"/>
  </g>

  <!-- ─── ORBIT RING around AI node ─── -->
  <circle class="ring" cx="52" cy="36" r="16"
    fill="none" stroke="#48CBCF" stroke-width="0.7" opacity="0.2" stroke-dasharray="4 3"/>

  <!-- ─── HALO (soft glow behind AI) ─── -->
  <circle class="halo" cx="52" cy="36" r="10"
    fill="#48CBCF" filter="url(#glow-soft)"/>

  <!-- ─── AI NODE ─── -->
  <circle class="ai-pulse" cx="52" cy="36" r="8"
    fill="rgba(72,203,207,0.15)" stroke="#48CBCF" stroke-width="1.3"
    filter="url(#glow-strong)"/>
  <!-- inner mark — brackets suggesting code/tool -->
  <g class="ai-node">
    <text x="52" y="40" text-anchor="middle"
      font-family="monospace" font-size="9" font-weight="bold"
      fill="#48CBCF" opacity="0.9">{}</text>
  </g>

  <!-- ─── INTENT / THOUGHT FLOW (human → AI) ─── -->
  <line class="intent" x1="28" y1="36" x2="43" y2="36"
    stroke="#48CBCF" stroke-width="0.8" opacity="0.5" stroke-dasharray="2 2"/>

  <!-- moving thought dots -->
  <circle class="thought th1" cx="31" cy="36" r="1.4" fill="#48CBCF" opacity="0.8"/>
  <circle class="thought th2" cx="36" cy="36" r="1.4" fill="#48CBCF" opacity="0.8"/>
  <circle class="thought th3" cx="41" cy="36" r="1.4" fill="#48CBCF" opacity="0.8"/>

  <!-- ─── TOOL DOTS orbiting AI node ─── -->
  <!-- dot 1: top -->
  <circle class="orbit1" cx="52" cy="20" r="2.2"
    fill="rgba(20,20,20,0.85)" stroke="#48CBCF" stroke-width="1" filter="url(#glow)"/>
  <!-- dot 2: bottom-right -->
  <circle class="orbit2" cx="64" cy="44" r="1.8"
    fill="rgba(20,20,20,0.85)" stroke="#48CBCF" stroke-width="1" filter="url(#glow)" opacity="0.7"/>
  <!-- dot 3: left of ring -->
  <circle class="orbit3" cx="36" cy="28" r="1.5"
    fill="rgba(20,20,20,0.85)" stroke="#48CBCF" stroke-width="0.9" filter="url(#glow)" opacity="0.6"/>

  <!-- ─── RESPONSE OUTPUT LINES (AI → right, like generated output) ─── -->
  <line class="resp rp1" x1="61" y1="30" x2="73" y2="30"
    stroke="#48CBCF" stroke-width="1.4" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  <line class="resp rp2" x1="61" y1="36" x2="71" y2="36"
    stroke="#48CBCF" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line class="resp rp3" x1="61" y1="42" x2="73" y2="42"
    stroke="#48CBCF" stroke-width="1.4" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
</svg>
