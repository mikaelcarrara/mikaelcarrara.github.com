<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      /* ──────────────────────────────────────
         GRID BACKGROUND
      ────────────────────────────────────── */
      .grid-line {
        stroke: #48CBCF;
        stroke-width: 0.4;
        opacity: 0;
        animation: gridFade 1.2s ease 0.1s forwards;
      }
      @keyframes gridFade { to { opacity: 0.07; } }

      /* ──────────────────────────────────────
         OUTER FRAME — draws clockwise
      ────────────────────────────────────── */
      .frame {
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        animation: drawFrame 1.4s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
      }
      @keyframes drawFrame { to { stroke-dashoffset: 0; } }

      /* ──────────────────────────────────────
         CORNER BRACKETS
      ────────────────────────────────────── */
      .brk {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        opacity: 0;
        animation: drawBrk 0.4s ease forwards;
      }
      .bk1 { animation-delay: 1.3s; }
      .bk2 { animation-delay: 1.4s; }
      .bk3 { animation-delay: 1.5s; }
      .bk4 { animation-delay: 1.6s; }
      @keyframes drawBrk { to { stroke-dashoffset: 0; opacity:1; } }

      /* ──────────────────────────────────────
         CENTER NODE
      ────────────────────────────────────── */
      .center-halo {
        opacity: 0;
        animation: haloIn 0.8s ease 1.2s forwards,
                   haloPulse 3.5s ease-in-out 2.5s infinite;
      }
      @keyframes haloIn { to { opacity: 1; } }
      @keyframes haloPulse {
        0%,100% { opacity: 0.12; r: 46; }
        50%     { opacity: 0.22; r: 54; }
      }

      .center-node {
        transform-origin: 240px 280px;
        transform-box: view-box;
        opacity: 0;
        animation: nodeIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 1.3s forwards,
                   nodePulse 3s ease-in-out 2.8s infinite;
      }
      @keyframes nodeIn {
        from { opacity:0; transform: scale(0); }
        to   { opacity:1; transform: scale(1); }
      }
      @keyframes nodePulse {
        0%,100% { opacity:1; }
        50%     { opacity:0.5; }
      }

      /* ──────────────────────────────────────
         SPOKE LINES (center → satellites)
      ────────────────────────────────────── */
      .spoke {
        stroke-dashoffset: 160;
        opacity: 0;
        animation: drawSpoke 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
      }
      .sp1 { stroke-dasharray: 160; animation-delay: 1.6s; }
      .sp2 { stroke-dasharray: 160; animation-delay: 1.7s; }
      .sp3 { stroke-dasharray: 160; animation-delay: 1.8s; }
      .sp4 { stroke-dasharray: 160; animation-delay: 1.9s; }
      .sp5 { stroke-dasharray: 160; animation-delay: 2.0s; }
      .sp6 { stroke-dasharray: 160; animation-delay: 2.1s; }
      @keyframes drawSpoke { to { stroke-dashoffset: 0; opacity:1; } }

      /* ──────────────────────────────────────
         SATELLITE NODES
      ────────────────────────────────────── */
      .sat {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      .s1 { animation-delay: 2.1s; }
      .s2 { animation-delay: 2.2s; }
      .s3 { animation-delay: 2.3s; }
      .s4 { animation-delay: 2.4s; }
      .s5 { animation-delay: 2.5s; }
      .s6 { animation-delay: 2.6s; }
      @keyframes satIn {
        from { opacity:0; transform: scale(0); }
        to   { opacity:1; transform: scale(1); }
      }

      /* individual satellite pulses, varied timing */
      .s1 { animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 2.1s forwards, satPulse 3.1s ease-in-out 3.2s infinite; }
      .s2 { animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 2.2s forwards, satPulse 2.7s ease-in-out 3.5s infinite; }
      .s3 { animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 2.3s forwards, satPulse 3.4s ease-in-out 3.0s infinite; }
      .s4 { animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 2.4s forwards, satPulse 2.9s ease-in-out 3.7s infinite; }
      .s5 { animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 2.5s forwards, satPulse 3.2s ease-in-out 3.3s infinite; }
      .s6 { animation: satIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 2.6s forwards, satPulse 2.8s ease-in-out 3.9s infinite; }
      @keyframes satPulse {
        0%,100% { opacity:1; }
        50%     { opacity:0.3; }
      }

      /* ──────────────────────────────────────
         TOKEN CARDS (float near satellites)
      ────────────────────────────────────── */
      .card {
        opacity: 0;
        animation: cardIn 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
      }
      .c1 { animation-delay: 2.7s; }
      .c2 { animation-delay: 2.85s; }
      .c3 { animation-delay: 3.0s; }
      .c4 { animation-delay: 3.15s; }
      .c5 { animation-delay: 3.3s; }
      .c6 { animation-delay: 3.45s; }
      @keyframes cardIn {
        from { opacity:0; transform: translateY(6px); }
        to   { opacity:1; transform: translateY(0); }
      }

      /* ──────────────────────────────────────
         ORBIT RING (dashed, rotates)
      ────────────────────────────────────── */
      .orbit {
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: drawOrbit 1.2s ease 1.5s forwards,
                   spinOrbit 30s linear 3s infinite;
        transform-origin: 240px 280px;
        transform-box: view-box;
      }
      @keyframes drawOrbit { to { stroke-dashoffset: 0; } }
      @keyframes spinOrbit { to { transform: rotate(360deg); } }

      /* ──────────────────────────────────────
         DATA FLOW DOTS along spokes (SMIL)
      ────────────────────────────────────── */

      /* ──────────────────────────────────────
         SCAN LINE sweeps
      ────────────────────────────────────── */
      .scan {
        animation: scanMove 4s ease-in-out 3.5s infinite;
      }
      @keyframes scanMove {
        0%   { opacity:0; transform: translateY(-200px); }
        10%  { opacity:0.15; }
        90%  { opacity:0.15; }
        100% { opacity:0; transform: translateY(200px); }
      }

      /* ──────────────────────────────────────
         SECONDARY RING (inner, counter-spin)
      ────────────────────────────────────── */
      .ring-inner {
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: drawOrbit 0.9s ease 1.8s forwards,
                   spinCounter 20s linear 3s infinite;
        transform-origin: 240px 280px;
        transform-box: view-box;
      }
      @keyframes spinCounter { to { transform: rotate(-360deg); } }
    </style>
  </defs>

  <!-- ──────────────────────────────────────
       GRID
  ────────────────────────────────────── -->
  <!-- vertical lines -->
  <line class="grid-line" x1="60"  y1="0" x2="60"  y2="560"/>
  <line class="grid-line" x1="120" y1="0" x2="120" y2="560"/>
  <line class="grid-line" x1="180" y1="0" x2="180" y2="560"/>
  <line class="grid-line" x1="240" y1="0" x2="240" y2="560"/>
  <line class="grid-line" x1="300" y1="0" x2="300" y2="560"/>
  <line class="grid-line" x1="360" y1="0" x2="360" y2="560"/>
  <line class="grid-line" x1="420" y1="0" x2="420" y2="560"/>
  <!-- horizontal lines -->
  <line class="grid-line" x1="0" y1="70"  x2="480" y2="70"/>
  <line class="grid-line" x1="0" y1="140" x2="480" y2="140"/>
  <line class="grid-line" x1="0" y1="210" x2="480" y2="210"/>
  <line class="grid-line" x1="0" y1="280" x2="480" y2="280"/>
  <line class="grid-line" x1="0" y1="350" x2="480" y2="350"/>
  <line class="grid-line" x1="0" y1="420" x2="480" y2="420"/>
  <line class="grid-line" x1="0" y1="490" x2="480" y2="490"/>

  <!-- ──────────────────────────────────────
       OUTER FRAME
  ────────────────────────────────────── -->
  <rect class="frame" x="20" y="20" width="440" height="520" rx="4"
    fill="none" stroke="#48CBCF" stroke-width="0.8" opacity="0.2"/>

  <!-- ──────────────────────────────────────
       CORNER BRACKETS
  ────────────────────────────────────── -->
  <polyline class="brk bk1" points="20,50 20,20 50,20"
    fill="none" stroke="#48CBCF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <polyline class="brk bk2" points="430,20 460,20 460,50"
    fill="none" stroke="#48CBCF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <polyline class="brk bk3" points="20,510 20,540 50,540"
    fill="none" stroke="#48CBCF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <polyline class="brk bk4" points="430,540 460,540 460,510"
    fill="none" stroke="#48CBCF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- ──────────────────────────────────────
       ORBIT RINGS
  ────────────────────────────────────── -->
  <circle class="orbit" cx="240" cy="280" r="138"
    fill="none" stroke="#48CBCF" stroke-width="0.6" opacity="0.12" stroke-dasharray="6 5"/>
  <circle class="ring-inner" cx="240" cy="280" r="82"
    fill="none" stroke="#48CBCF" stroke-width="0.5" opacity="0.15" stroke-dasharray="3 4"/>

  <!-- ──────────────────────────────────────
       SCAN LINE
  ────────────────────────────────────── -->
  <line class="scan" x1="20" y1="280" x2="460" y2="280"
    stroke="#48CBCF" stroke-width="1.5" filter="url(#glow)"/>

  <!-- ──────────────────────────────────────
       SPOKE LINES (center 240,280 → each satellite)
  ────────────────────────────────────── -->
  <!-- top -->
  <line class="spoke sp1" x1="240" y1="280" x2="240" y2="114"
    stroke="#48CBCF" stroke-width="0.7" opacity="0.35"/>
  <!-- top-right -->
  <line class="spoke sp2" x1="240" y1="280" x2="383" y2="194"
    stroke="#48CBCF" stroke-width="0.7" opacity="0.35"/>
  <!-- bottom-right -->
  <line class="spoke sp3" x1="240" y1="280" x2="383" y2="366"
    stroke="#48CBCF" stroke-width="0.7" opacity="0.35"/>
  <!-- bottom -->
  <line class="spoke sp4" x1="240" y1="280" x2="240" y2="446"
    stroke="#48CBCF" stroke-width="0.7" opacity="0.35"/>
  <!-- bottom-left -->
  <line class="spoke sp5" x1="240" y1="280" x2="97"  y2="366"
    stroke="#48CBCF" stroke-width="0.7" opacity="0.35"/>
  <!-- top-left -->
  <line class="spoke sp6" x1="240" y1="280" x2="97"  y2="194"
    stroke="#48CBCF" stroke-width="0.7" opacity="0.35"/>

  <!-- ──────────────────────────────────────
       CENTER HALO + NODE
  ────────────────────────────────────── -->
  <circle class="center-halo" cx="240" cy="280" r="46"
    fill="#48CBCF" filter="url(#glow-soft)"/>
  <!-- outer ring -->
  <circle class="center-node" cx="240" cy="280" r="32"
    fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.5" filter="url(#glow-strong)"/>
  <!-- inner ring -->
  <circle class="center-node" cx="240" cy="280" r="20"
    fill="rgba(72,203,207,0.15)" stroke="#48CBCF" stroke-width="1"/>
  <!-- core dot -->
  <circle class="center-node" cx="240" cy="280" r="7"
    fill="#48CBCF" filter="url(#glow-strong)"/>
  <circle class="center-node" cx="240" cy="280" r="3.5"
    fill="rgba(10,10,10,0.9)"/>

  <!-- ──────────────────────────────────────
       SATELLITE NODES
  ────────────────────────────────────── -->
  <!-- top -->
  <g class="sat s1">
    <circle cx="240" cy="100" r="10" fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="240" cy="100" r="4"  fill="#48CBCF" opacity="0.8"/>
  </g>
  <!-- top-right -->
  <g class="sat s2">
    <circle cx="390" cy="184" r="10" fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="390" cy="184" r="4"  fill="#48CBCF" opacity="0.8"/>
  </g>
  <!-- bottom-right -->
  <g class="sat s3">
    <circle cx="390" cy="376" r="10" fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="390" cy="376" r="4"  fill="#48CBCF" opacity="0.8"/>
  </g>
  <!-- bottom -->
  <g class="sat s4">
    <circle cx="240" cy="460" r="10" fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="240" cy="460" r="4"  fill="#48CBCF" opacity="0.8"/>
  </g>
  <!-- bottom-left -->
  <g class="sat s5">
    <circle cx="90"  cy="376" r="10" fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="90"  cy="376" r="4"  fill="#48CBCF" opacity="0.8"/>
  </g>
  <!-- top-left -->
  <g class="sat s6">
    <circle cx="90"  cy="184" r="10" fill="rgba(72,203,207,0.1)" stroke="#48CBCF" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="90"  cy="184" r="4"  fill="#48CBCF" opacity="0.8"/>
  </g>

  <!-- ──────────────────────────────────────
       TOKEN CARDS near each satellite
  ────────────────────────────────────── -->
  <!-- top -->
  <g class="card c1">
    <rect x="198" y="60" width="84" height="24" rx="3" fill="rgba(72,203,207,0.06)" stroke="#48CBCF" stroke-width="0.7" opacity="0.7"/>
    <rect x="205" y="67" width="24" height="2.5" rx="1" fill="#48CBCF" opacity="0.6"/>
    <rect x="232" y="67" width="14" height="2.5" rx="1" fill="#ffffff" opacity="0.12"/>
    <rect x="249" y="67" width="10" height="2.5" rx="1" fill="#ffffff" opacity="0.08"/>
    <rect x="205" y="73" width="36" height="2"   rx="1" fill="#ffffff" opacity="0.07"/>
  </g>
  <!-- top-right -->
  <g class="card c2">
    <rect x="400" y="148" width="68" height="24" rx="3" fill="rgba(72,203,207,0.06)" stroke="#48CBCF" stroke-width="0.7" opacity="0.7"/>
    <rect x="407" y="155" width="18" height="2.5" rx="1" fill="#48CBCF" opacity="0.6"/>
    <rect x="428" y="155" width="12" height="2.5" rx="1" fill="#ffffff" opacity="0.12"/>
    <rect x="407" y="161" width="28" height="2"   rx="1" fill="#ffffff" opacity="0.07"/>
  </g>
  <!-- bottom-right -->
  <g class="card c3">
    <rect x="400" y="388" width="68" height="24" rx="3" fill="rgba(72,203,207,0.06)" stroke="#48CBCF" stroke-width="0.7" opacity="0.7"/>
    <rect x="407" y="395" width="22" height="2.5" rx="1" fill="#48CBCF" opacity="0.6"/>
    <rect x="432" y="395" width="10" height="2.5" rx="1" fill="#ffffff" opacity="0.12"/>
    <rect x="407" y="401" width="32" height="2"   rx="1" fill="#ffffff" opacity="0.07"/>
  </g>
  <!-- bottom -->
  <g class="card c4">
    <rect x="198" y="474" width="84" height="24" rx="3" fill="rgba(72,203,207,0.06)" stroke="#48CBCF" stroke-width="0.7" opacity="0.7"/>
    <rect x="205" y="481" width="28" height="2.5" rx="1" fill="#48CBCF" opacity="0.6"/>
    <rect x="236" y="481" width="16" height="2.5" rx="1" fill="#ffffff" opacity="0.12"/>
    <rect x="205" y="487" width="20" height="2"   rx="1" fill="#ffffff" opacity="0.07"/>
  </g>
  <!-- bottom-left -->
  <g class="card c5">
    <rect x="12" y="388" width="68" height="24" rx="3" fill="rgba(72,203,207,0.06)" stroke="#48CBCF" stroke-width="0.7" opacity="0.7"/>
    <rect x="19" y="395" width="16" height="2.5" rx="1" fill="#48CBCF" opacity="0.6"/>
    <rect x="38" y="395" width="20" height="2.5" rx="1" fill="#ffffff" opacity="0.12"/>
    <rect x="19" y="401" width="34" height="2"   rx="1" fill="#ffffff" opacity="0.07"/>
  </g>
  <!-- top-left -->
  <g class="card c6">
    <rect x="12" y="148" width="68" height="24" rx="3" fill="rgba(72,203,207,0.06)" stroke="#48CBCF" stroke-width="0.7" opacity="0.7"/>
    <rect x="19" y="155" width="20" height="2.5" rx="1" fill="#48CBCF" opacity="0.6"/>
    <rect x="42" y="155" width="12" height="2.5" rx="1" fill="#ffffff" opacity="0.12"/>
    <rect x="19" y="161" width="26" height="2"   rx="1" fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- ──────────────────────────────────────
       FLOW DOTS (SMIL — center → each satellite)
  ────────────────────────────────────── -->
  <!-- to top -->
  <circle r="2.5" fill="#48CBCF" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#sp-top"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <!-- to top-right -->
  <circle r="2.5" fill="#48CBCF" filter="url(#glow)">
    <animateMotion dur="2.6s" begin="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#sp-tr"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- to bottom-right -->
  <circle r="2" fill="#48CBCF" opacity="0.7">
    <animateMotion dur="2.8s" begin="3.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#sp-br"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="3.9s" repeatCount="indefinite"/>
  </circle>
  <!-- to bottom -->
  <circle r="2.5" fill="#48CBCF" filter="url(#glow)">
    <animateMotion dur="2.5s" begin="4.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#sp-bot"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.5s" begin="4.3s" repeatCount="indefinite"/>
  </circle>
  <!-- to bottom-left -->
  <circle r="2" fill="#48CBCF" opacity="0.7">
    <animateMotion dur="2.7s" begin="4.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#sp-bl"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="2.7s" begin="4.8s" repeatCount="indefinite"/>
  </circle>
  <!-- to top-left -->
  <circle r="2.5" fill="#48CBCF" filter="url(#glow)">
    <animateMotion dur="2.3s" begin="5.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#sp-tl"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.3s" begin="5.1s" repeatCount="indefinite"/>
  </circle>

  <!-- ──────────────────────────────────────
       MOTION PATHS (hidden)
  ────────────────────────────────────── -->
  <defs>
    <path id="sp-top" d="M240,280 L240,100"/>
    <path id="sp-tr"  d="M240,280 L390,184"/>
    <path id="sp-br"  d="M240,280 L390,376"/>
    <path id="sp-bot" d="M240,280 L240,460"/>
    <path id="sp-bl"  d="M240,280 L90,376"/>
    <path id="sp-tl"  d="M240,280 L90,184"/>
  </defs>
</svg>
